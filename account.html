<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="로그인한 회원의 계정 정보를 확인합니다.">
  <meta name="theme-color" content="#f7c600">
  <title>회원 정보 | 컴포즈커피</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
  <script src="account.js" defer></script>
  <script src="site-auth.js" defer></script>
</head>
<body class="auth-page">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="홈으로"><span class="brand-mark" aria-hidden="true">C</span><span class="brand-word">COMPOSE<span>COFFEE</span></span></a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
    <nav class="primary-nav" id="primary-nav" aria-label="주 메뉴">
      <a class="nav-link" href="index.html">홈</a>
      <a class="nav-link" href="menu.html">메뉴</a>
      <a class="nav-link" href="contact.html">문의하기</a>
      <a class="nav-link is-current" href="account.html" aria-current="page">내 정보</a>
      <a class="nav-link" id="nav-logout-link" href="#logout">로그아웃</a>
    </nav>
  </header>

  <main id="main" class="auth-main account-main">
    <section class="auth-card account-card" aria-labelledby="account-title">
      <p class="eyebrow">MY ACCOUNT</p>
      <h1 id="account-title">회원 정보</h1>
      <p class="auth-description">가입한 계정 정보를 확인할 수 있습니다.</p>
      <p class="auth-status" id="account-status" role="status" aria-live="polite">회원 정보를 확인하고 있습니다.</p>
      <dl class="account-details" id="account-details" hidden>
        <div class="account-row"><dt>닉네임</dt><dd id="account-nickname"></dd></div>
        <div class="account-row"><dt>이메일 주소</dt><dd id="account-email"></dd></div>
        <div class="account-row"><dt>성별</dt><dd id="account-gender"></dd></div>
        <div class="account-row"><dt>가입일</dt><dd id="account-created"></dd></div>
      </dl>
      <div class="account-actions" id="account-actions" hidden>
        <a class="button button-outline" href="inquiries.html">문의 확인하기</a>
        <button class="button button-dark" id="account-logout" type="button">로그아웃</button>
        <a class="button button-outline" href="index.html">홈으로</a>
      </div>
      <a class="account-login-link" id="account-login-link" href="login.html" hidden>로그인 페이지로</a>
      <p class="auth-notice">회원 정보는 로그인한 계정의 세션으로 확인합니다.</p>
    </section>
  </main>

  <footer class="site-footer auth-footer">
    <a class="brand brand-footer" href="index.html"><span class="brand-mark" aria-hidden="true">C</span><span class="brand-word">COMPOSE<span>COFFEE</span></span></a>
    <div class="footer-links"><a href="index.html">홈</a><a href="contact.html">문의하기</a></div>
    <small>본 사이트는 컴포즈커피 공식 페이지가 아닙니다.</small>
  </footer>
</body>
</html>
